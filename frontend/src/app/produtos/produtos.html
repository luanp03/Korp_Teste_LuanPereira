<div class="container">
  <h2 class="page-title">Cadastro de Produtos</h2>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Novo Produto</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form class="product-form" (ngSubmit)="cadastrarProduto()">
        <mat-form-field appearance="fill">
          <mat-label>Código</mat-label>
          <input matInput placeholder="Ex: PROD001" [(ngModel)]="novoCodigo" name="codigoProduto" required>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Descrição</mat-label>
          <input matInput placeholder="Ex: Nome do produto" [(ngModel)]="novaDescricao" name="descricaoProduto" required>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Saldo de Estoque</mat-label>
          <input matInput type="number" placeholder="Ex: Quantidade Inicial" [(ngModel)]="novoSaldo" name="saldoProduto" required>
        </mat-form-field>

        <button mat-raised-button color="primary" class="btn-save" type="submit">
          Cadastrar Produto
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="list-card">
    <mat-card-header>
      <mat-card-title>Produtos Cadastrados</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="produtos" class="products-table"> 
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let produto">{{produto.codigo}}</td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let produto">{{produto.descricao}}</td>
        </ng-container>

        <ng-container matColumnDef="saldo">
          <th mat-header-cell *matHeaderCellDef>Saldo</th>
          <td mat-cell *matCellDef="let produto">{{produto.saldo}}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let produto">
            <button matButton color="warn" (click)="excluirProduto(produto.id)">Excluir</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
